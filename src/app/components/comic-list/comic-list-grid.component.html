<div class="main-content">
    <div class="section-content section-content-p30">
        <div>
            <h1>{{ currentPublisherName }}</h1>
        </div>
        <hr style="margin-bottom: 15px;">
        <div class="container-fluid">
            <div class="row">

                <!-- loop over my collection of comic books -->
                 <div *ngFor="let tempComic of comics" class="col-md-3">

                    <div class="product-box" *ngIf="tempComic.imageUrl == null">
                        <a routerLink="/comics/{{ tempComic.id }}">
                                <img src="/assets/images/misc/placeholder.png" class="img-responsive placehold">
                        </a>
                            <h1>{{ tempComic.title }} #{{ tempComic.issue }}</h1>
                    </div>
                    <div class="product-box" *ngIf="tempComic.imageUrl != null">
                        <a routerLink="/comics/{{ tempComic.id }}">
                                <img src="{{ tempComic.imageUrl }}" class="img-responsive">
                        </a>
                            <h1>{{ tempComic.title }} #{{ tempComic.issue }}</h1>
                    </div>
                    
                 </div>

                 <!-- if no comics found -->
                  <div *ngIf="comics?.length == 0" class = "alert alert-warning col-md-12" role="alert">
                    No comics found...
                  </div>

                <!-- begin footer -->
                <div class="footer-pagination">
                    <div class="row">
                        <div class="col-md-6">
    
                            <div class="col-md-6">
                                <div class="row">
                                    <div class="col-md-9" style="padding-left: 30%">
    
                                        <ngb-pagination [(page)]="thePageNumber" [pageSize]="thePageSize" 
                                                [collectionSize]="theTotalElements" [maxSize]="5"
                                                [boundaryLinks]="true" (pageChange)="listComics()">
    
                                        </ngb-pagination>
    
                                    </div>
                                    
                                    <div class="col-md-3 mt-2" style="text-align: right;">
                                        <span class="mr-2">Page Size</span>
    
                                        <select #myPageSelect (change)="updatePageSize(myPageSelect.value)">
                                            <option selected="true">5</option>
                                            <option>10</option>
                                            <option>20</option>
                                            <option>50</option>
                                        </select>
                                    </div>
    
                                </div>
                            </div>
                            
    
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
