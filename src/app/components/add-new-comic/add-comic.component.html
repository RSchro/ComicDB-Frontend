<div class="main-content page-m">
    <div class="section-content section-content-p3">
        <div class="container-fluid">
            <form (ngSubmit)="onSubmit()">
                
                <div class="form-area">
                    <h3>Add New Book</h3>

                    <div class="row">
                        <div class="col-md-2"><label for="title">Title</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input name="title" id="title" type="text" [(ngModel)]="title" >
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-2"><label for="publisherChoice">Publisher</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <select [(ngModel)]="publisherChoice" id="publisher" name="publisher">
                                    <option selected="true" disabled="disabled" hidden></option>
                                    <option *ngFor="let tempPublisher of publishers" [ngValue]="tempPublisher.id">
                                        {{ tempPublisher.publisher }}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-2"><label for="issue">Issue</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input  id="issue" name="issue" type="text" [(ngModel)]="issue" >
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-2"><label for="printingNum">Print Number</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input id="printingNum" name="printingNum" type="text" [(ngModel)]="printingNum">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-2"><label for="upc">UPC</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input id="upc" name="upc" type="text" [(ngModel)]="upc">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-2"><label for="dateCreated">Date Published</label></div>
                        <div class="col-md-9">
                            <div class="input-space">
                                <input id="dateCreated" name="dateCreated" type="text" [(ngModel)]="dateCreated">
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Submit Button -->
                 <div class="text-center">
                    <button type="submit" class="btn btn-info">Add</button>
                 </div>

            </form>
        </div>
    </div>
</div>
